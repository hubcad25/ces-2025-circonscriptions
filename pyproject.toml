[project]
name = "ces-2025-circonscriptions"
version = "0.1.0"
description = "MRP estimates by federal riding from the 2025 Canadian Election Study"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "jax>=0.12.0.1",
    "numpyro>=0.22.0",
    "pandas>=3.1.0",
    "pyreadstat>=1.3.7",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
